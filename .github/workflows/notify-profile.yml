name: Notify profile stats
on:
  push:
    branches: [main, master]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile update
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.LANG_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mazen-seif21/Mazen-seif21/dispatches \
            -d '{"event_type":"update-langs"}'